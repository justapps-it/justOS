# GTK 3 programs on justOS: justOS's look (the theme is in
# /usr/share/themes/justOS), its typeface, no title bar buttons of their
# own (the desktop's frame has them), and justOS's GTK module (built from
# tools/linux/justos-gtk.c: no "Trash" in the file chooser, as there is no
# GVfs to open it).
[Settings]
gtk-modules=justos-gtk
gtk-theme-name=justOS
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-font-name=Google Sans Flex 11
gtk-decoration-layout=:
gtk-dialogs-use-header=false
